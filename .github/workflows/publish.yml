name: publish

# Triggered by publishing a GitHub release tagged vX.Y.Z. The tag drives the published version for
# every ecosystem (the in-repo versions are placeholders). Mirrors the ancho / spice-labs-cli flow.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  setup:
    name: version + notify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      thread-ts: ${{ steps.notify.outputs.thread-ts }}
      channel-id: ${{ steps.notify.outputs.channel-id }}
    steps:
      - name: Notify release start
        id: notify
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: release
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}
          channel: "#release-notifications"
      - name: Get version from tag (strip v) and validate
        id: version
        run: |
          RAW="${{ github.event.release.tag_name }}"
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z, got: $RAW" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  npm:
    name: npm
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: npm version "${{ needs.setup.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cargo:
    name: cargo
    needs: setup
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Set crate version from tag
        run: sed -i "s/^version = .*/version = \"${{ needs.setup.outputs.version }}\"/" Cargo.toml
      - run: cargo test
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  maven:
    name: maven central + github packages
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Write settings.xml for Central + GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_USERNAME_SG }}</username>
                <password>${{ secrets.GH_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Import GPG key
        run: echo "${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Set version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${{ needs.setup.outputs.version }}" -DgenerateBackupPoms=false
      - name: Publish to Maven Central
        run: mvn -B -ntp deploy -P maven-central
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
      - name: Publish to GitHub Packages
        run: mvn -B -ntp deploy -P github

  notify:
    name: notify result
    needs: [setup, npm, cargo, maven]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.npm.result }}" = "success" ] \
            && [ "${{ needs.cargo.result }}" = "success" ] \
            && [ "${{ needs.maven.result }}" = "success" ]; then
            echo "status=deployment-success" >> "$GITHUB_OUTPUT"
          else
            echo "status=deployment-failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify result
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: ${{ steps.status.outputs.status }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}
          environment: production
          thread-ts: ${{ needs.setup.outputs.thread-ts }}
          channel-id: ${{ needs.setup.outputs.channel-id }}
