[package]
name = "spice-coordinates"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Canonical content identifiers (content hashes + git blob ids) and package coordinates (purl) for software artifacts — the Rust implementation of spice-labs-inc/coordinates."
repository = "https://github.com/spice-labs-inc/coordinates"
homepage = "https://github.com/spice-labs-inc/coordinates"
readme = "README.md"
keywords = ["gitoid", "sha256", "content-hash", "purl", "identifier"]
categories = ["cryptography"]

[lib]
name = "coordinates"

# The only runtime dependencies: the audited RustCrypto digests (Rust std has no hashing).
[dependencies]
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"

# Test-only. Does not propagate to crates that depend on this one.
[dev-dependencies]
serde_json = "1"
